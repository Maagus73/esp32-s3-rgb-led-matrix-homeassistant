substitutions:
  name: esp32-s3-matrix # Adjust accordingly
  friendly_name: "ESP32 S3 Matrix" # Adjust accordingly
  hidden_ssid: "false"
  factory_reset_disabled: "true"

  log_level: "INFO"
  # Available Log Levels
  # NONE: Turns off all logging completely.
  # ERROR: Only logs critical failures that prevent correct operation.
  # WARN: Logs errors and warning conditions (such as recoverable faulty sensor readings).
  # INFO: Logs errors, warnings, and general system milestone events.
  # DEBUG: Default level; logs development and status details.
  # VERBOSE: Detailed debug info, including deeper state changes.
  # VERY_VERBOSE: Logs all internal traffic including high-frequency data bus updates (like I²C or SPI), which can impact performanc

# Enable logging
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: ${log_level}

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

preferences:
  flash_write_interval: 1min

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: "key" # Adjust accordingly

ota:
  - platform: esphome
    password: "password" # Adjust accordingly

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "ESP32-S3-Matrix" # Adjust accordingly
    password: "password" # Adjust accordingly

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  flash_size: 4MB

captive_portal:
# ============================================================
# WEB SERVER
# ============================================================

web_server:
  port: 80
  version: 3
# ============================================================
# I2C
# ============================================================
i2c:
  sda: GPIO11
  scl: GPIO12
  scan: true
# ============================================================
# QMI8658
# ============================================================
motion:
  - platform: qmi8658
    id: mein_bewegungssensor
    accelerometer_range: 4G
    gyroscope_range: 2048DPS
    update_interval: 100ms
# ============================================================
# GLOBALE VARIABLEN
# ============================================================
globals:
  # ----------------------------------------------------------
  # Aktuelle Display-Ausrichtung
  #
  # -1   = noch nicht initialisiert
  #  0   = normale Ausrichtung
  # 180  = Display auf dem Kopf
  # ----------------------------------------------------------
  - id: text_rot_mode
    type: int
    restore_value: no
    initial_value: "-1"
  # ----------------------------------------------------------
  # Automatische Rotation
  # ----------------------------------------------------------
  - id: auto_rotation
    type: bool
    restore_value: true
    initial_value: "false"
  # ----------------------------------------------------------
  # Orientierung beim Start bereits erkannt?
  # ----------------------------------------------------------
  - id: orientation_initialized
    type: bool
    restore_value: no
    initial_value: "false"
  # ----------------------------------------------------------
  # Orientierungs-Kandidat
  # ----------------------------------------------------------
  - id: orientation_candidate
    type: int
    restore_value: no
    initial_value: "-1"
  # ----------------------------------------------------------
  # Zeitpunkt des Kandidaten
  # ----------------------------------------------------------
  - id: orientation_candidate_since
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # ----------------------------------------------------------
  # Matrix Regen - Zustand
  # ----------------------------------------------------------
  - id: matrix_rain_initialized
    type: bool
    restore_value: no
    initial_value: "false"
  - id: matrix_rain_position
    type: float[8]
    restore_value: no

# ============================================================
# Home Assistant Anzeigen / Entitäten
# ============================================================
# ============================================================
# TEXT
# ============================================================
text:
  - platform: template
    name: "Matrix Lauftext"
    id: matrix_text
    mode: text
    optimistic: true
    min_length: 1
    max_length: 100
    initial_value: "HELLO WORLD"
    restore_value: true
# ============================================================
# NUMBERS
# ============================================================
number:
  # ----------------------------------------------------------
  # HELLIGKEIT
  # ----------------------------------------------------------
  - platform: template
    name: "Matrix Helligkeit"
    id: matrix_brightness
    optimistic: true
    min_value: 30
    max_value: 255
    initial_value: 60
    step: 5
    restore_value: true
  # ----------------------------------------------------------
  # LAUFGESCHWINDIGKEIT
  # ----------------------------------------------------------
  - platform: template
    name: "Matrix Geschwindigkeit"
    id: matrix_scroll_speed
    optimistic: true
    min_value: 30
    max_value: 500
    initial_value: 120
    step: 10
    unit_of_measurement: "ms"
    restore_value: true
# ============================================================
# SCHALTER
# ============================================================
switch:
  # ----------------------------------------------------------
  # AUTOMATISCHE ROTATION
  # ----------------------------------------------------------
  - platform: template
    name: "Matrix Automatische Rotation"
    id: matrix_auto_rotation
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(auto_rotation) = true;
          id(orientation_initialized) = false;
          id(orientation_candidate) = -1;
          id(orientation_candidate_since) =
            millis();
    turn_off_action:
      - lambda: |-
          id(auto_rotation) = false;
# ============================================================
# MATRIX MODUS - Alles was möglich ist in Auswahlbox
# Keine Standard ESPHome effekte sonder von ChatGPT verbesserte
# ============================================================
select:
  - platform: template
    name: "Matrix Modus"
    id: matrix_mode
    optimistic: true
    restore_value: true
    options:
      - "Aus"
      - "Lauftext"
      - "Vollfarbe"
      - "Matrix Regen"
      - "Rainbow"
      - "Fireworks"
      - "Color Wipe"
      - "Random Twinkle"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI(
              "MATRIX",
              "Matrix Modus geändert/initialisiert: '%s'",
              x.c_str()
            );
            // id(matrix_brightness).publish_state(x) 
            // setzt die min. Helligkeit bei den einzelnen Effekten
            // kann bei jedem Effekt problemlos abgeändert werden. 
            // ------------------------------------------------
            // MATRIX REGEN BEIM MODUSWECHSEL NEU STARTEN
            // ------------------------------------------------
            if (x == "Matrix Regen") {
              id(matrix_rain_initialized) = false;
              id(matrix_brightness).publish_state(90);  
            }
            // ------------------------------------------------
            // RAINBOW
            // ------------------------------------------------
            if (x == "Rainbow") {
              id(matrix_brightness).publish_state(50);
            }
            // ------------------------------------------------
            // FIREWORKS BEIM MODUSWECHSEL
            // ------------------------------------------------
            if (x == "Fireworks") {
              id(matrix_brightness).publish_state(165);
            }
            // ------------------------------------------------
            // COLOR WIPE BEIM MODUSWECHSEL
            // ------------------------------------------------
            if (x == "Color Wipe") {
              id(matrix_brightness).publish_state(130);
            }
            // ------------------------------------------------
            // RANDOM TWINKLE BEIM MODUSWECHSEL
            // ------------------------------------------------
            if (x == "Random Twinkle") {
              id(matrix_brightness).publish_state(110);
            }
            // ------------------------------------------------
            // LAUFTEXT BEIM MODUSWECHSEL
            // ------------------------------------------------
            if (x == "Lauftext") {
              id(matrix_brightness).publish_state(60);
            }
            // ------------------------------------------------
            // TEST 0 GRAD
            // ------------------------------------------------
            if (x == "Test 0 Grad") {
              id(text_rot_mode) = 0;
              ESP_LOGI(
                "MATRIX",
                "Manueller Test: 0 Grad"
              );
            }
            // ------------------------------------------------
            // TEST 180 GRAD
            // ------------------------------------------------
            else if (x == "Test 180 Grad") {
              id(text_rot_mode) = 180;
              ESP_LOGI(
                "MATRIX",
                "Manueller Test: 180 Grad"
              );
            }
# ============================================================
# SENSOREN
# werden über
# - delta: 0.01
# - heartbeat: 5s
# extra noch eingeschränkt, da sie sonst unnötig viel Daten senden
# ============================================================
sensor:
  # ----------------------------------------------------------
  # BESCHLEUNIGUNG X
  # ----------------------------------------------------------
  - platform: motion
    motion_id: mein_bewegungssensor
    type: acceleration_x
    name: "Matrix Beschleunigung X"
    id: matrix_accel_x
    filters:
      - or:
          - delta: 0.01
          - heartbeat: 5s
  # ----------------------------------------------------------
  # BESCHLEUNIGUNG Y
  # ----------------------------------------------------------
  - platform: motion
    motion_id: mein_bewegungssensor
    type: acceleration_y
    name: "Matrix Beschleunigung Y"
    id: matrix_accel_y
    filters:
      - or:
          - delta: 0.01
          - heartbeat: 5s
  # ----------------------------------------------------------
  # BESCHLEUNIGUNG Z
  # ----------------------------------------------------------
  - platform: motion
    motion_id: mein_bewegungssensor
    type: acceleration_z
    name: "Matrix Beschleunigung Z"
    filters:
      - or:
          - delta: 0.01
          - heartbeat: 10s
  # ----------------------------------------------------------
  # GYRO X
  # ----------------------------------------------------------
  - platform: motion
    motion_id: mein_bewegungssensor
    type: angular_rate_x
    name: "Matrix Rotation X"
  # ----------------------------------------------------------
  # GYRO Y
  # ----------------------------------------------------------
  - platform: motion
    motion_id: mein_bewegungssensor
    type: angular_rate_y
    name: "Matrix Rotation Y"
  # ----------------------------------------------------------
  # GYRO Z
  # ----------------------------------------------------------
  - platform: motion
    motion_id: mein_bewegungssensor
    type: angular_rate_z
    name: "Matrix Rotation Z"
  # ----------------------------------------------------------
  # SENSOR TEMPERATUR
  # ----------------------------------------------------------
  - platform: qmi8658
    type: temperature
    name: "Matrix Sensor Temperatur"
    filters:
      - or:
          - delta: 0.2
          - heartbeat: 30s
  # ----------------------------------------------------------
  # WIFI
  # ----------------------------------------------------------
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  # ----------------------------------------------------------
  # UPTIME
  # ----------------------------------------------------------
  - platform: uptime
    name: "Uptime"
    filters:
      - lambda: return x / 3600.0;
    unit_of_measurement: "h"
# ============================================================
# AUTOMATISCHE ORIENTIERUNG - 0 oder 180 Grad
# ============================================================
interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(auto_rotation)) {
            return;
          }
          // ------------------------------------------------
          // X-WERT
          // ------------------------------------------------
          float ax =
            id(matrix_accel_x).state;
          int detected_orientation = -1;
          // ------------------------------------------------
          // 180°
          // ------------------------------------------------
          if (ax <= -0.80f) {
            detected_orientation = 180;
          }
          // ------------------------------------------------
          // 0°
          // ------------------------------------------------
          else if (ax >= +0.80f) {
            detected_orientation = 0;
          }
          // ------------------------------------------------
          // ZWISCHENPOSITION
          //
          // 45 / 90 / 135 Grad werden ignoriert.
          // ------------------------------------------------
          if (detected_orientation == -1) {
            return;
          }
          // ------------------------------------------------
          // NEUER KANDIDAT
          // ------------------------------------------------
          if (
            detected_orientation !=
            id(orientation_candidate)
          ) {
            id(orientation_candidate) =
              detected_orientation;
            id(orientation_candidate_since) =
              millis();
          }
          // ------------------------------------------------
          // BOOT / INITIALISIERUNG
          // ------------------------------------------------
          if (!id(orientation_initialized)) {
            if (
              millis() -
              id(orientation_candidate_since)
              >= 500
            ) {
              id(text_rot_mode) =
                detected_orientation;
              id(orientation_initialized) =
                true;
              ESP_LOGI(
                "MATRIX",
                "Orientierung initialisiert: %d Grad (X=%.2f)",
                detected_orientation,
                ax
              );
            }
            return;
          }
          // ------------------------------------------------
          // NORMALE ÄNDERUNG
          // ------------------------------------------------
          if (
            detected_orientation !=
            id(text_rot_mode)
          ) {
            if (
              millis() -
              id(orientation_candidate_since)
              >= 500
            ) {
              id(text_rot_mode) =
                detected_orientation;
              ESP_LOGI(
                "MATRIX",
                "Automatische Rotation: %d Grad (X=%.2f)",
                detected_orientation,
                ax
              );
            }
          }
# ============================================================
# TEXT SENSOR
# ============================================================
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
  - platform: version
    name: "ESPHome Version"
# ============================================================
# FONT - Lauftext braucht einen Font
# ============================================================
font:
  - file: "waveshare-esp32-s3-rgb-led-matrix/assets/fonts/pixeloperator8.ttf"
    id: matrix_font
    size: 8
# ============================================================
# RGB MATRIX
# ============================================================
# ============================================================
# VIRTUELLE RGB-AUSGÄNGE FÜR DEN LAUFTEXT
# ============================================================
# Diese drei Outputs steuern KEINE GPIOs.
# Sie dienen ausschließlich dazu, Home Assistant einen
# normalen RGB-Farbwähler bereitzustellen.
# !!verhindert einen Farbblitz bei einem wechsel!!
# Die Werte werden später vom Display-Lambda ausgelesen.
# ============================================================
output:
  - platform: template
    id: text_color_red
    type: float
    write_action:
      - lambda: |-
          ESP_LOGD(
            "MATRIX",
            "Virtuelles Rot: %.3f",
            state
          );
  - platform: template
    id: text_color_green
    type: float
    write_action:
      - lambda: |-
          ESP_LOGD(
            "MATRIX",
            "Virtuelles Grün: %.3f",
            state
          );
  - platform: template
    id: text_color_blue
    type: float
    write_action:
      - lambda: |-
          ESP_LOGD(
            "MATRIX",
            "Virtuelles Blau: %.3f",
            state
          );
light:
  # ============================================================
  # ECHTER HARDWARE-AUSGANG
  # ============================================================
  - platform: esp32_rmt_led_strip
    id: pixel_matrix
    internal: true # wird versteckt, da änderungen zu Problemen beim Display führen
    pin: GPIO14
    num_leds: 64
    rgb_order: RGB
    chipset: WS2811
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
  # ============================================================
  # VIRTUELLER LAUFTEXT-FARBWÄHLER
  # ============================================================
  - platform: rgb
    id: matrix_text_color
    name: "Matrix Farbe"
    red: text_color_red
    green: text_color_green
    blue: text_color_blue
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
# ============================================================
# DISPLAY
# ============================================================
display:
  - platform: addressable_light
    id: matrix_display
    addressable_light_id: pixel_matrix
    width: 8
    height: 8
    # ========================================================
    # PIXEL MAPPER
    # ========================================================
    pixel_mapper: |-
      if (id(text_rot_mode) == 180) {
        int inverted_x =
          7 - x;
        int inverted_y =
          7 - y;
        return inverted_x +
               (inverted_y * 8);
      }
      // -1 während Boot = 0°
      return x + (y * 8);
    update_interval: 32ms
    # ========================================================
    # DISPLAY RENDERER
    # ========================================================
    lambda: |-
      std::string mode =
        id(matrix_mode).current_option();
      // ====================================================
      // HELLIGKEIT
      // ====================================================
      float brightness =
        id(matrix_brightness).state / 255.0f;
      if (brightness < 0.01f) {
        brightness = 0.01f;
      }
      // ====================================================
      // MATRIX REGEN
      // ====================================================
      if (mode == "Matrix Regen") {
        // --------------------------------------------------
        // EINMALIGE INITIALISIERUNG
        // --------------------------------------------------
        if (!id(matrix_rain_initialized)) {
          for (int x = 0; x < 8; x++) {
            // Unterschiedliche Startpositionen
            // erzeugen einen natürlichen Einstieg.
            id(matrix_rain_position)[x] =
              -(float)(rand() % 12);
          }
          id(matrix_rain_initialized) = true;
        }
        // --------------------------------------------------
        // SCHWARZER HINTERGRUND
        // --------------------------------------------------
        it.fill(
          Color::BLACK
        );
        // --------------------------------------------------
        // JEDE SPALTE
        // --------------------------------------------------
        for (int x = 0; x < 8; x++) {
          float head =
            id(matrix_rain_position)[x];
          // ------------------------------------------------
          // BEWEGUNG
          // ------------------------------------------------
          head += 0.18f;
          id(matrix_rain_position)[x] =
            head;
          // ------------------------------------------------
          // WENN DIE SPUR KOMPLETT UNTEN IST
          // ------------------------------------------------
          if (head > 11.0f) {
            // Neue Spur startet wieder oberhalb
            // des Displays.
            id(matrix_rain_position)[x] =
              -(float)(3 + rand() % 8);
            head =
              id(matrix_rain_position)[x];
          }
          // ------------------------------------------------
          // SPUR
          // ------------------------------------------------
          const int trail_length = 7;
          for (
            int trail = 0;
            trail < trail_length;
            trail++
          ) {

            int y =
              (int)(head - trail);
            if (
              y < 0 ||
              y >= 8
            ) {
              continue;
            }
            // ------------------------------------------------
            // HELLIGKEITSVERLAUF
            // ------------------------------------------------
            float fade =
              1.0f -
              (
                (float)trail /
                (float)trail_length
              );
            // Quadratischer Verlauf:
            //
            // vorne hell
            // hinten sehr weich
            fade =
              fade * fade;
            uint8_t green =
              (uint8_t)(
                255.0f *
                fade
              );
            // ------------------------------------------------
            // HELLIGER KOPF
            // ------------------------------------------------
            if (trail == 0) {

              green = 255;
            }
            // ------------------------------------------------
            // MATRIX-FILM-LOOK
            // ------------------------------------------------
            // Kleine Zufallsvariation verhindert,
            // dass alle Spuren vollkommen identisch aussehen.
            if (trail > 0) {
              green =
                (uint8_t)(
                  green *
                  (
                    0.75f +
                    ((rand() % 25) / 100.0f)
                  )
                );
            }
            // ------------------------------------------------
            // HELLIGKEIT AUS MATRIX HELLIGKEIT
            // ------------------------------------------------
            green =
              (uint8_t)(
                green *
                brightness
              );
            if (green > 2) {
              it.draw_pixel_at(
                x,
                y,
                Color(
                  0,
                  green,
                  0
                )
              );
            }
          }
        }
        return;
      }
      // ====================================================
      // AUS - Display schwarz
      // ====================================================
      if (mode == "Aus") {
        it.fill(
          Color::BLACK
        );
        return;
      }
      // ====================================================
      // VOLLFARBE - alle 64 LED's gemeinsam als Farbe
      // ====================================================
      if (mode == "Vollfarbe") {
        auto remote =
          id(matrix_text_color).remote_values;
        uint8_t r =
        (uint8_t)(
          remote.get_red() *
          brightness *
          255.0f
        );
      uint8_t g =
        (uint8_t)(
          remote.get_green() *
          brightness *
          255.0f
        );
      uint8_t b =
        (uint8_t)(
          remote.get_blue() *
          brightness *
          255.0f
        );
        Color display_color =
          Color(r, g, b);
        for (int y = 0; y < 8; y++) {
          for (int x = 0; x < 8; x++) {
            it.draw_pixel_at(
              x,
              y,
              display_color
            );
          }
        }
        return;
      }
      // ====================================================
      // RAINBOW
      // ====================================================
      if (mode == "Rainbow") {
        // --------------------------------------------------
        // SCHWARZER GRUND
        // --------------------------------------------------
        it.fill(
          Color::BLACK
        );
        // --------------------------------------------------
        // ZEITBASIERTE BEWEGUNG
        // --------------------------------------------------
        // Je kleiner der Wert, desto schneller bewegt
        // sich der Regenbogen.
        uint32_t now =
          millis();
        float animation =
          (now % 12000) / 12000.0f;
        // --------------------------------------------------
        // PIXEL ZEICHNEN
        // --------------------------------------------------
        for (int y = 0; y < 8; y++) {
          for (int x = 0; x < 8; x++) {
            // Farbposition über das gesamte Display.
            //
            // Dadurch entsteht ein kontinuierlicher
            // Farbverlauf.
            float position =
              (
                ((float)x / 7.0f) * 0.65f +
                ((float)y / 7.0f) * 0.35f +
                animation
              );
            // Auf 0..1 begrenzen / wiederholen.
            position =
              position -
              floor(position);
            // ------------------------------------------------
            // HSV → RGB
            // ------------------------------------------------
            float h =
              position * 6.0f;
            int sector =
              (int)floor(h);
            float fraction =
              h - sector;
            float q =
              1.0f - fraction;
            float t =
              fraction;
            float r;
            float g;
            float b;
            switch (sector % 6) {
              case 0:
                r = 1.0f;
                g = t;
                b = 0.0f;
                break;
              case 1:
                r = q;
                g = 1.0f;
                b = 0.0f;
                break;
              case 2:
                r = 0.0f;
                g = 1.0f;
                b = t;
                break;
              case 3:
                r = 0.0f;
                g = q;
                b = 1.0f;
                break;
              case 4:
                r = t;
                g = 0.0f;
                b = 1.0f;
                break;
              default:
                r = 1.0f;
                g = 0.0f;
                b = q;
                break;
            }
            // ------------------------------------------------
            // MATRIX HELLIGKEIT
            // ------------------------------------------------
            uint8_t red =
              (uint8_t)(
                r *
                brightness *
                255.0f
              );
            uint8_t green =
              (uint8_t)(
                g *
                brightness *
                255.0f
              );
            uint8_t blue =
              (uint8_t)(
                b *
                brightness *
                255.0f
              );
            it.draw_pixel_at(
              x,
              y,
              Color(
                red,
                green,
                blue
              )
            );
          }
        }
        return;
      }
      // ====================================================
      // FIREWORKS
      // ====================================================
      if (mode == "Fireworks") {
        // --------------------------------------------------
        // DATENSTRUKTUR
        // --------------------------------------------------
        struct Particle {
          float x;
          float y;
          float vx;
          float vy;
          float life;
          float max_life;
          uint8_t r;
          uint8_t g;
          uint8_t b;
          bool active;
        };
        // --------------------------------------------------
        // STATISCHER ZUSTAND
        // --------------------------------------------------
        static Particle particles[32];
        static bool initialized = false;
        static uint32_t last_spawn = 0;
        // --------------------------------------------------
        // INITIALISIERUNG
        // --------------------------------------------------
        if (!initialized) {
          initialized = true;
          for (int i = 0; i < 32; i++) {
            particles[i].active =
              false;
          }
          last_spawn =
            millis();
        }
        uint32_t now =
          millis();
        // --------------------------------------------------
        // NEUES FEUERWERK
        // --------------------------------------------------
        if (
          now - last_spawn >=
          1800
        ) {
          last_spawn =
            now;
          // ----------------------------------------------
          // Explosionszentrum
          //
          // eher im oberen Bereich des Displays,
          // damit die Rakete optisch von unten kommt.
          // ----------------------------------------------
          float explosion_x =
            2.0f +
            (rand() % 40) / 10.0f;
          float explosion_y =
            1.0f +
            (rand() % 25) / 10.0f;
          // ----------------------------------------------
          // Farbe auswählen
          // ----------------------------------------------
          int color_type =
            rand() % 6;
          uint8_t cr = 255;
          uint8_t cg = 255;
          uint8_t cb = 255;
          switch (color_type) {
            case 0:
              cr = 255;
              cg = 40;
              cb = 20;
              break;
            case 1:
              cr = 20;
              cg = 255;
              cb = 60;
              break;
            case 2:
              cr = 40;
              cg = 120;
              cb = 255;
              break;
            case 3:
              cr = 255;
              cg = 60;
              cb = 220;
              break;
            case 4:
              cr = 255;
              cg = 180;
              cb = 20;
              break;
            default:
              cr = 180;
              cg = 80;
              cb = 255;
              break;
          }
          // ----------------------------------------------
          // PARTIKEL ERZEUGEN
          // ----------------------------------------------
          for (int i = 0; i < 32; i++) {
            if (
              particles[i].active
            ) {
              continue;
            }
            float angle =
              (
                (float)(rand() % 360) *
                3.14159265f /
                180.0f
              );
            float speed =
              0.035f +
              ((rand() % 100) / 2500.0f);
            particles[i].x =
              explosion_x;
            particles[i].y =
              explosion_y;
            particles[i].vx =
              cosf(angle) *
              speed;
            particles[i].vy =
              sinf(angle) *
              speed;
            particles[i].life =
              1.0f;
            particles[i].max_life =
              1.0f +
              ((rand() % 50) / 100.0f);
            particles[i].r =
              cr;
            particles[i].g =
              cg;
            particles[i].b =
              cb;
            particles[i].active =
              true;
          }
        }
        // --------------------------------------------------
        // SCHWARZER HINTERGRUND
        // --------------------------------------------------
        it.fill(
          Color::BLACK
        );
        // --------------------------------------------------
        // PARTIKEL AKTUALISIEREN
        // --------------------------------------------------
        for (int i = 0; i < 32; i++) {
          Particle &p =
            particles[i];
          if (!p.active) {
            continue;
          }
          // ----------------------------------------------
          // POSITION
          // ----------------------------------------------
          p.x +=
            p.vx;
          p.y +=
            p.vy;
          // ----------------------------------------------
          // SCHWERKRAFT
          // ----------------------------------------------
          p.vy +=
            0.0015f;
          // ----------------------------------------------
          // LEBENSDAUER
          // ----------------------------------------------
          p.life -=
            0.018f;
          if (
            p.life <= 0.0f ||
            p.x < -1.0f ||
            p.x > 8.0f ||
            p.y < -1.0f ||
            p.y > 8.0f
          ) {
            p.active =
              false;
            continue;
          }
          // ----------------------------------------------
          // WEICHES AUSBLENDEN
          // ----------------------------------------------
          float fade =
            p.life /
            p.max_life;
          fade =
            fade * fade;
          uint8_t r =
            (uint8_t)(
              p.r *
              fade *
              brightness
            );
          uint8_t g =
            (uint8_t)(
              p.g *
              fade *
              brightness
            );
          uint8_t b =
            (uint8_t)(
              p.b *
              fade *
              brightness
            );
          // ----------------------------------------------
          // AUF PIXEL RUNDEN
          // ----------------------------------------------
          int px =
            (int)roundf(p.x);
          int py =
            (int)roundf(p.y);
          if (
            px >= 0 &&
            px < 8 &&
            py >= 0 &&
            py < 8
          ) {
            it.draw_pixel_at(
              px,
              py,
              Color(
                r,
                g,
                b
              )
            );
          }
        }
        return;
      }
      // ====================================================
      // COLOR WIPE
      // ====================================================
      if (mode == "Color Wipe") {
        // --------------------------------------------------
        // STATISCHER ANIMATIONSZUSTAND
        // --------------------------------------------------
        static float wipe_position = 0.0f;
        static uint32_t last_wipe =
          0;
        uint32_t now =
          millis();
        // --------------------------------------------------
        // NEUE WIPE-POSITION
        // --------------------------------------------------
        if (
          now - last_wipe >=
          70
        ) {
          wipe_position +=
            0.35f;
          last_wipe =
            now;
        }
        // --------------------------------------------------
        // NACH DEM ENDE NEU BEGINNEN
        // --------------------------------------------------
        if (
          wipe_position >=
          9.0f
        ) {
          wipe_position =
            -1.0f;
        }
        // --------------------------------------------------
        // FARBE AUS MATRIX FARBE
        // --------------------------------------------------
        auto remote =
          id(matrix_text_color).remote_values;
        float red =
          remote.get_red();
        float green =
          remote.get_green();
        float blue =
          remote.get_blue();
        // --------------------------------------------------
        // DISPLAY ZEICHNEN
        // --------------------------------------------------
        it.fill(
          Color::BLACK
        );
        for (int y = 0; y < 8; y++) {
          for (int x = 0; x < 8; x++) {
            // ----------------------------------------------
            // DISTANZ ZUR WIPE-FRONT
            // ----------------------------------------------
            float distance =
              wipe_position -
              (float)y;
            // ----------------------------------------------
            // PIXEL NOCH NICHT ERREICHT
            // ----------------------------------------------
            if (distance < 0.0f) {
              continue;
            }
            // ----------------------------------------------
            // WEICHER NACHLAUF
            // ----------------------------------------------
            float intensity =
              1.0f;
            if (
              distance > 0.0f &&
              distance < 2.0f
            ) {
              intensity =
                1.0f -
                (
                  distance /
                  2.0f
                );
            }
            // ----------------------------------------------
            // PIXEL HINTER DER FRONT
            // ----------------------------------------------
            if (
              distance >= 2.0f
            ) {
              intensity =
                0.25f;
            }
            // ----------------------------------------------
            // HELLIGKEIT
            // ----------------------------------------------
            uint8_t r =
              (uint8_t)(
                red *
                intensity *
                brightness *
                255.0f
              );
            uint8_t g =
              (uint8_t)(
                green *
                intensity *
                brightness *
                255.0f
              );
            uint8_t b =
              (uint8_t)(
                blue *
                intensity *
                brightness *
                255.0f
              );
            if (
              r > 0 ||
              g > 0 ||
              b > 0
            ) {
              it.draw_pixel_at(
                x,
                y,
                Color(
                  r,
                  g,
                  b
                )
              );
            }
          }
        }
        return;
      }
      // ====================================================
      // RANDOM TWINKLE
      // ====================================================
      if (mode == "Random Twinkle") {
        // --------------------------------------------------
        // DATENSTRUKTUR
        // --------------------------------------------------
        struct Twinkle {
          float level;
          float velocity;
          bool active;
        };
        // --------------------------------------------------
        // ZUSTAND
        // --------------------------------------------------
        static Twinkle stars[64];
        static bool initialized =
          false;
        // --------------------------------------------------
        // INITIALISIERUNG
        // --------------------------------------------------
        if (!initialized) {
          initialized =
            true;
          for (int i = 0; i < 64; i++) {
            stars[i].level =
              0.0f;
            stars[i].velocity =
              0.0f;
            stars[i].active =
              false;
          }
        }
        // --------------------------------------------------
        // FARBE
        // --------------------------------------------------
        auto remote =
          id(matrix_text_color).remote_values;
        float red =
          remote.get_red();
        float green =
          remote.get_green();
        float blue =
          remote.get_blue();
        // --------------------------------------------------
        // NEUE PIXEL
        //
        // Nur wenige Pixel gleichzeitig.
        // --------------------------------------------------
        if (
          rand() % 100 < 12
        ) {
          int index =
            rand() % 64;
          if (
            !stars[index].active
          ) {
            stars[index].level =
              0.0f;
            stars[index].velocity =
              0.025f +
              (
                (rand() % 100) /
                5000.0f
              );
            stars[index].active =
              true;
          }
        }
        // --------------------------------------------------
        // DISPLAY LEEREN
        // --------------------------------------------------
        it.fill(
          Color::BLACK
        );
        // --------------------------------------------------
        // ALLE 64 PIXEL VERARBEITEN
        // --------------------------------------------------
        for (
          int i = 0;
          i < 64;
          i++
        ) {
          Twinkle &star =
            stars[i];
          if (
            !star.active
          ) {
            continue;
          }
          // ------------------------------------------------
          // AUFLEUCHTEN
          // ------------------------------------------------
          if (
            star.velocity > 0.0f
          ) {
            star.level +=
              star.velocity;
            // ----------------------------------------------
            // HÖHEPUNKT
            // ----------------------------------------------
            if (
              star.level >= 1.0f
            ) {
              star.level =
                1.0f;
              star.velocity =
                -(
                  0.012f +
                  (
                    (rand() % 100) /
                    8000.0f
                  )
                );
            }
          }
          // ------------------------------------------------
          // AUSBLENDEN
          // ------------------------------------------------
          else {
            star.level +=
              star.velocity;
            if (
              star.level <= 0.0f
            ) {
              star.level =
                0.0f;
              star.velocity =
                0.0f;
              star.active =
                false;
              continue;
            }
          }
          // ------------------------------------------------
          // HELLIGKEIT
          // ------------------------------------------------
          float level =
            star.level *
            brightness;
          uint8_t r =
            (uint8_t)(
              red *
              level *
              255.0f
            );
          uint8_t g =
            (uint8_t)(
              green *
              level *
              255.0f
            );
          uint8_t b =
            (uint8_t)(
              blue *
              level *
              255.0f
            );
          // ------------------------------------------------
          // KOORDINATEN
          // ------------------------------------------------
          int px =
            i % 8;
          int py =
            i / 8;
          // ------------------------------------------------
          // ZEICHNEN
          // ------------------------------------------------
          if (
            r > 0 ||
            g > 0 ||
            b > 0
          ) {
            it.draw_pixel_at(
              px,
              py,
              Color(
                r,
                g,
                b
              )
            );
          }
        }
        return;
      }
      // ====================================================
      // TEST 0 / 180
      // ====================================================
      if (
        mode == "Test 0 Grad" ||
        mode == "Test 180 Grad"
      ) {
        it.fill(
          Color::BLACK
        );
        Color red =
          Color(
            (uint8_t)(255 * brightness),
            0,
            0
          );
        Color green =
          Color(
            0,
            (uint8_t)(255 * brightness),
            0
          );
        Color blue =
          Color(
            0,
            0,
            (uint8_t)(255 * brightness)
          );
        Color white =
          Color(
            (uint8_t)(255 * brightness),
            (uint8_t)(255 * brightness),
            (uint8_t)(255 * brightness)
          );
        it.draw_pixel_at(
          0,
          0,
          red
        );
        it.draw_pixel_at(
          7,
          0,
          green
        );
        it.draw_pixel_at(
          0,
          7,
          blue
        );
        it.draw_pixel_at(
          7,
          7,
          white
        );
        for (int x = 1; x < 7; x++) {
          it.draw_pixel_at(
            x,
            0,
            red
          );
        }
        return;
      }
      // ====================================================
      // LAUFTEXT
      // ====================================================
      if (mode != "Lauftext") {
        it.fill(
          Color::BLACK
        );
        return;
      }
      // ====================================================
      // ROTATION GEÄNDERT?
      // ====================================================
      static int last_rotation = -1;
      static int scroll_pos = 8;
      if (
        last_rotation !=
        id(text_rot_mode)
      ) {
        scroll_pos = 8;
        last_rotation =
          id(text_rot_mode);
      }
      // ====================================================
      // TEXT
      // ====================================================
      static std::string last_text = "";
      static int text_width = 48;
      std::string current_text =
        id(matrix_text).state;
      if (
        current_text !=
        last_text
      ) {
        int x_bearing;
        int y_bearing;
        int text_height;
        it.get_text_bounds(
          0,
          0,
          current_text.c_str(),
          id(matrix_font),
          TextAlign::TOP_LEFT,
          &x_bearing,
          &y_bearing,
          &text_width,
          &text_height
        );
        last_text =
          current_text;
        scroll_pos =
          8;
      }
      // ====================================================
      // SCROLL
      // ====================================================
      static uint32_t last_scroll = 0;
      uint32_t now =
        millis();
      if (
        now - last_scroll >=
        (uint32_t)
        id(matrix_scroll_speed).state
      ) {
        scroll_pos--;
        last_scroll =
          now;
      }
      if (
        scroll_pos <
        -(text_width + 4)
      ) {
        scroll_pos =
          8;
      }
      // ====================================================
      // HINTERGRUND
      // ====================================================
      it.fill(
        Color::BLACK
      );
      // ====================================================
      // LAUFTEXT-FARBE AUS DEM HA-LIGHT
      // ====================================================
      //
      // WICHTIG:
      // Wir lesen die REMOTE-Werte.
      //
      // Diese entsprechen der von Home Assistant gesetzten
      // Zielfarbe und nicht der momentan tatsächlich
      // ausgegebenen LED-Helligkeit.
      //
      // Dadurch ist die Farbe unabhängig von der Helligkeit
      // des normalen "8x8 RGB Matrix"-Light-Entities.
      //
      float red =
        id(matrix_text_color).remote_values.get_red();
      float green =
        id(matrix_text_color).remote_values.get_green();
      float blue =
        id(matrix_text_color).remote_values.get_blue();
      // ====================================================
      // EIGENE LAUFTEXT-HELLIGKEIT
      // ====================================================
      //
      // Wir verwenden die Farbe des Light-Entities,
      // aber die Helligkeit wird weiterhin ausschließlich
      // über "Matrix Helligkeit" gesteuert.
      //
      uint8_t text_r =
        (uint8_t)(
          red *
          brightness *
          255.0f
        );
      uint8_t text_g =
        (uint8_t)(
          green *
          brightness *
          255.0f
        );
      uint8_t text_b =
        (uint8_t)(
          blue *
          brightness *
          255.0f
        );
      Color text_color =
        Color(
          text_r,
          text_g,
          text_b
        );
      // ====================================================
      // TEXT AUSGEBEN
      // ====================================================
      it.print(
        scroll_pos,
        0,
        id(matrix_font),
        text_color,
        current_text.c_str()
      );
